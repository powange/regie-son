name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    strategy:
      # One platform failing must not cancel the others: a broken Linux
      # runner should still let the Windows and macOS artifacts ship.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # Installed directly rather than through cache-apt-pkgs-action: that
      # action was pinned to @latest, silently stopped installing anything
      # after an upstream update, and still reported success — which made the
      # build fail much later on a missing gdk-3.0.pc.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            c.version = '${VERSION}';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(c, null, 2) + '\n');
            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/^version = \"[^\"]+\"/m, 'version = \"${VERSION}\"');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);
          "

      - name: Cache yt-dlp sidecar
        id: ytdlp-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ytdlp-${{ matrix.target }}-${{ hashFiles('.github/workflows/release.yml') }}

      - name: Download yt-dlp sidecar
        if: steps.ytdlp-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          TARGET="${{ matrix.target }}"
          case "$TARGET" in
            x86_64-pc-windows-msvc)
              curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -o "src-tauri/binaries/yt-dlp-${TARGET}.exe"
              ;;
            x86_64-unknown-linux-gnu)
              curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp" -o "src-tauri/binaries/yt-dlp-${TARGET}"
              chmod +x "src-tauri/binaries/yt-dlp-${TARGET}"
              ;;
            x86_64-apple-darwin|aarch64-apple-darwin)
              curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" -o "src-tauri/binaries/yt-dlp-${TARGET}"
              chmod +x "src-tauri/binaries/yt-dlp-${TARGET}"
              ;;
          esac

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and sign
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Régie Son ${{ github.ref_name }}"
          releaseBody: "Voir les changements dans cette version."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  # Strip the version from every release asset, so the README can carry
  # permanent links: https://.../releases/latest/download/<name>
  # Runs once after the whole matrix, so nothing races on latest.json.
  finalize:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Drop the version from asset names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          escaped="${version//./\\.}"

          # "Regie.Son_0.3.41_x64-setup.exe" -> "Regie.Son_x64-setup.exe".
          # The tag inside a download URL is preceded by "v", never by _ or -,
          # so the [_-] guard leaves it untouched.
          while read -r id name; do
            new=$(printf '%s' "$name" | sed -E "s/[_-]${escaped}//")
            if [ "$new" != "$name" ]; then
              echo "$name -> $new"
              gh api --method PATCH "repos/$REPO/releases/assets/$id" -f name="$new" --silent
            fi
          done < <(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | "\(.id) \(.name)"')

          # latest.json still points at the old URLs; rewrite them the same way.
          mkdir -p orig patched
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --dir orig --clobber
          sed -E "/\"url\"/ s/[_-]${escaped}//" orig/latest.json > patched/latest.json
          if cmp -s orig/latest.json patched/latest.json; then
            echo "latest.json inchange" && exit 0
          fi
          gh release upload "$TAG" patched/latest.json --repo "$REPO" --clobber
