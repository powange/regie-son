name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default: the checks job runs third-party code (npm ci,
# i18next-cli). Only the jobs that create, fill and publish the release get
# write access.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # yt-dlp release bundled as the sidecar. Pinned so that a build is
  # reproducible and the cache is invalidated by bumping it; the app updates
  # its copy on its own afterwards.
  YTDLP_VERSION: "2026.08.19"

jobs:
  # The release is created once, up front, as a draft. Letting each matrix job
  # create it races: they all check for the release at the same moment, all
  # find nothing, and every loser of that race fails on "already exists".
  #
  # Keeping it a draft until the very end also means /releases/latest keeps
  # pointing at the previous good version for the whole build, instead of
  # flipping to a half-uploaded one.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Idempotent, so re-running a failed workflow reuses its draft.
          id=$(gh api "repos/$REPO/releases" --paginate \
                 --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/$REPO/releases" \
                   -f tag_name="$TAG" \
                   -f name="Régie Son $TAG" \
                   -f body="Voir les changements dans cette version." \
                   -F draft=true -F prerelease=false --jq '.id')
            echo "Brouillon créé : $id"
          else
            echo "Brouillon existant réutilisé : $id"
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  # Une seule passe de vérifications, avant de lancer quatre builds : un
  # catalogue de traduction incomplet ou une chaîne laissée en dur n'a pas
  # besoin de quatre plateformes pour être constatée. Les tests portent les
  # garde-fous i18n (parité des locales, codes d'erreur Rust), donc ils font
  # partie de la vérification et pas seulement de l'hygiène.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Même version que les builds et que ci.yml. Pas moins de 22 :
          # i18next-cli passe par execa, qui utilise Set.prototype.union.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Traductions (extraction, chaînes en dur, paramètres)
        run: npm run i18n:check

      # Les types générés sont commités, parce que le build de production ne
      # doit pas avoir besoin de l'outil qui les produit. Il faut donc vérifier
      # qu'ils n'ont pas divergé du catalogue.
      - name: Types à jour
        run: |
          npm run i18n:types
          git diff --exit-code -- src/types \
            || { echo "::error::src/types est périmé — lance npm run i18n:types et commite"; exit 1; }

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  release:
    needs: [create-release, checks]
    strategy:
      # One platform failing must not cancel the others: a broken Linux
      # runner should still let the Windows and macOS artifacts ship.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # Installed directly rather than through cache-apt-pkgs-action: that
      # action was pinned to @latest, silently stopped installing anything
      # after an upstream update, and still reported success — which made the
      # build fail much later on a missing gdk-3.0.pc.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            c.version = '${VERSION}';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(c, null, 2) + '\n');
            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/^version = \"[^\"]+\"/m, 'version = \"${VERSION}\"');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);
          "

      - name: Cache yt-dlp sidecar
        id: ytdlp-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: src-tauri/binaries
          key: ytdlp-${{ env.YTDLP_VERSION }}-${{ matrix.target }}

      # -f so that an HTTP error fails the step instead of saving the error
      # page as the binary, and the checksum published with the release so
      # that a truncated or tampered download never reaches the cache.
      - name: Download yt-dlp sidecar
        if: steps.ytdlp-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          case "$TARGET" in
            x86_64-pc-windows-msvc)                    ASSET=yt-dlp.exe;   OUT="yt-dlp-${TARGET}.exe" ;;
            x86_64-unknown-linux-gnu)                  ASSET=yt-dlp;       OUT="yt-dlp-${TARGET}" ;;
            x86_64-apple-darwin|aarch64-apple-darwin)  ASSET=yt-dlp_macos; OUT="yt-dlp-${TARGET}" ;;
            *) echo "::error::No yt-dlp asset for $TARGET"; exit 1 ;;
          esac
          BASE="https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}"
          mkdir -p src-tauri/binaries
          cd src-tauri/binaries
          curl -fsSL --retry 3 "$BASE/$ASSET" -o "$OUT"
          curl -fsSL --retry 3 "$BASE/SHA2-256SUMS" -o SHA2-256SUMS
          expected=$(awk -v f="$ASSET" '$2 == f { print $1 }' SHA2-256SUMS)
          rm SHA2-256SUMS
          if command -v sha256sum >/dev/null; then
            actual=$(sha256sum "$OUT" | cut -d' ' -f1)
          else
            actual=$(shasum -a 256 "$OUT" | cut -d' ' -f1)
          fi
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::Checksum mismatch for $ASSET: expected '$expected', got '$actual'"
            rm -f "$OUT"
            exit 1
          fi
          chmod +x "$OUT"

      # Also runs on a cache hit: a binary that does not start must not ship.
      # On Windows the checksum stands in for it.
      - name: Check yt-dlp sidecar
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin="src-tauri/binaries/yt-dlp-${{ matrix.target }}"
          version=$("$bin" --version)
          echo "yt-dlp $version"
          [ "$version" = "$YTDLP_VERSION" ] \
            || { echo "::error::Bundled yt-dlp is $version, expected $YTDLP_VERSION"; exit 1; }

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and sign
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

  # Renames the assets, then publishes. Runs only when every platform
  # succeeded (the default `success()` condition): a partial build leaves the
  # release as a draft, so /releases/latest keeps serving the last good
  # version instead of a half-populated one.
  #
  # Works through the API by release id, not by tag: the by-tag endpoint does
  # not return drafts.
  finalize:
    needs: [create-release, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
    steps:
      - name: Drop the version from asset names
        run: |
          set -euo pipefail
          version="${TAG#v}"
          escaped="${version//./\\.}"

          # "Regie.Son_0.3.43_x64-setup.exe" -> "Regie.Son_x64-setup.exe".
          # The tag inside a download URL is preceded by "v", never by _ or -,
          # so the [_-] guard leaves it untouched.
          while read -r id name; do
            new=$(printf '%s' "$name" | sed -E "s/[_-]${escaped}//")
            if [ "$new" != "$name" ]; then
              echo "$name -> $new"
              gh api --method PATCH "repos/$REPO/releases/assets/$id" -f name="$new" --silent
            fi
          done < <(gh api "repos/$REPO/releases/$RELEASE_ID/assets" --paginate \
                     --jq '.[] | "\(.id) \(.name)"')

      - name: Point latest.json at the renamed assets
        run: |
          set -euo pipefail
          version="${TAG#v}"
          escaped="${version//./\\.}"

          asset_id=$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" --paginate \
                       --jq '.[] | select(.name == "latest.json") | .id')
          if [ -z "$asset_id" ]; then
            echo "latest.json absent de la release" >&2
            exit 1
          fi

          mkdir -p orig patched
          gh api "repos/$REPO/releases/assets/$asset_id" \
            -H "Accept: application/octet-stream" > orig/latest.json

          # The four build jobs each read latest.json, add their platform and
          # upload it again, in parallel: one can overwrite another's entry.
          # A platform missing here would stop receiving updates without any
          # error, so refuse to publish and leave the release as a draft.
          missing=$(jq -r '["linux-x86_64","windows-x86_64","darwin-x86_64","darwin-aarch64"]
                           - (.platforms | keys) | .[]' orig/latest.json)
          if [ -n "$missing" ]; then
            echo "::error::Plateformes absentes de latest.json : $(echo $missing)"
            echo "Relancer les jobs de build concernés, puis finalize." >&2
            exit 1
          fi
          sed -E "/\"url\"/ s/[_-]${escaped}//" orig/latest.json > patched/latest.json
          python3 -c "import json,sys; json.load(open('patched/latest.json'))"

          if cmp -s orig/latest.json patched/latest.json; then
            echo "latest.json inchangé"
            exit 0
          fi
          gh api --method DELETE "repos/$REPO/releases/assets/$asset_id" --silent
          gh api --method POST \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=latest.json" \
            -H "Content-Type: application/json" --input patched/latest.json --silent

      - name: Publish the release
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" -F draft=false --silent
          echo "Release publiée : $TAG"
